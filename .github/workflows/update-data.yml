name: Update NHL data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL + ESPN data
        run: |
          python - <<'PY'
          import json, urllib.request, datetime, xml.etree.ElementTree as ET
          base='https://api-web.nhle.com/v1'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NHL-Russia/8.1'})
              with urllib.request.urlopen(req,timeout=25) as r: return json.load(r)
          def safe(url):
              try: return get(url)
              except Exception: return {}
          today=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          s=safe(f'{base}/score/{today}')
          st=safe(f'{base}/standings/now')
          games=[]
          for g in s.get('games',[]):
              a=g.get('awayTeam',{}); h=g.get('homeTeam',{})
              gid=g.get('id')
              landing=safe(f'{base}/gamecenter/{gid}/landing') if gid else {}
              gs=landing.get('summary',{}) if isinstance(landing,dict) else {}
              state=g.get('gameState','')
              if state in ('OFF','FINAL'): status='FINAL'
              elif state in ('LIVE','CRIT'): status='LIVE'
              else: status='FUT'
              item={'id':gid,'away':a.get('abbrev',a.get('placeName',{}).get('default','—')),
                    'home':h.get('abbrev',h.get('placeName',{}).get('default','—')),
                    'awayScore':a.get('score','—'),'homeScore':h.get('score','—'),'status':status,
                    'date':g.get('startTimeUTC',''),'period':g.get('periodDescriptor',{}).get('periodType',''),
                    'clock':g.get('clock',{}).get('timeRemaining','') if isinstance(g.get('clock'),dict) else '',
                    'nhlUrl':f'https://www.nhl.com/gamecenter/{gid}' if gid else ''}
              # Try to retain useful scoring events without assuming one fixed NHL schema.
              events=[]
              for key in ('scoring','goals'):
                  val=gs.get(key)
                  if isinstance(val,list):
                      for e in val[:30]:
                          if isinstance(e,dict):
                              events.append({'time':e.get('timeInPeriod',e.get('time','')),
                                             'text':e.get('description',e.get('goalDescription',e.get('typeDescKey',''))),
                                             'period':e.get('periodDescriptor',{}).get('number','') if isinstance(e.get('periodDescriptor'),dict) else ''})
                      break
              if events: item['events']=events
              stats={}
              # Common summary/team stat shapes; keep simple display values when available.
              tgs=gs.get('teamGameStats') or gs.get('teamStats')
              if isinstance(tgs,list):
                  for z in tgs:
                      if isinstance(z,dict):
                          n=str(z.get('category',z.get('name',''))).lower()
                          v=z.get('away',z.get('awayValue')); w=z.get('home',z.get('homeValue'))
                          if 'shot' in n: item['shots']={'away':v,'home':w}
                          if 'face' in n: stats['faceoff']=f'{v} — {w}'
                          if 'power' in n: stats['pp']=f'{v} — {w}'
              if stats: item['stats']=stats
              games.append(item)
          standings=[]
          for x in st.get('standings',[]):
              standings.append({'team':x.get('teamAbbrev',{}).get('default','—'),'pts':x.get('points','—'),
                                'wins':x.get('wins','—'),'losses':x.get('losses','—'),'diff':x.get('goalDifferential','—')})
          news=[]
          try:
              req=urllib.request.Request('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/news?limit=12',
                                          headers={'User-Agent':'NHL-Russia/8.1'})
              with urllib.request.urlopen(req,timeout=25) as r: en=json.load(r)
              for a in en.get('articles',[])[:12]:
                  news.append({'title':a.get('headline',a.get('title','')),'description':a.get('description',''),
                               'url':a.get('links',{}).get('web',{}).get('href',''),'published':a.get('published','')[:16].replace('T',' ')})
          except Exception: pass
          # Match ESPN scoreboard links to NHL games where possible.
          try:
              req=urllib.request.Request(f'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates={today.replace("-","")}',
                                          headers={'User-Agent':'NHL-Russia/8.1'})
              with urllib.request.urlopen(req,timeout=25) as r: es=json.load(r)
              bypair={}
              for ev in es.get('events',[]):
                  comp=(ev.get('competitions') or [{}])[0]
                  teams=comp.get('competitors',[])
                  names=[t.get('team',{}).get('abbreviation') for t in teams]
                  if len(names)==2: bypair[f'{names[0]}-{names[1]}']=ev.get('links',[{}])[0].get('href','')
              for x in games:
                  u=bypair.get(f"{x['away']}-{x['home']}")
                  if u: x['espnUrl']=u
          except Exception: pass
          data={'updated':datetime.datetime.now(datetime.timezone.utc).isoformat(),'games':games,'standings':standings,'news':news}
          with open('data.json','w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          PY
      - name: Commit data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          git diff --cached --quiet || git commit -m "Update NHL and ESPN data"
          git push

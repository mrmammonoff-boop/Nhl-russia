name: Update NHL data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch NHL + ESPN data
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime, re

          NHL='https://api-web.nhle.com/v1'

          def get_json(url, timeout=25):
              req=urllib.request.Request(
                  url,
                  headers={
                      'User-Agent':'NHL-Russia/10.0',
                      'Accept':'application/json,text/plain,*/*'
                  }
              )
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)

          def safe(url):
              try:
                  return get_json(url)
              except Exception:
                  return {}

          today=datetime.datetime.now(datetime.timezone.utc).date().isoformat()

          # ---------- NHL ----------
          s=safe(f'{NHL}/score/{today}')
          st=safe(f'{NHL}/standings/now')

          games=[]
          for g in s.get('games',[]):
              a=g.get('awayTeam',{})
              h=g.get('homeTeam',{})
              gid=g.get('id')

              landing=safe(f'{NHL}/gamecenter/{gid}/landing') if gid else {}
              gs=landing.get('summary',{}) if isinstance(landing,dict) else {}

              state=g.get('gameState','')
              if state in ('OFF','FINAL'):
                  status='FINAL'
              elif state in ('LIVE','CRIT'):
                  status='LIVE'
              else:
                  status='FUT'

              item={
                  'id':gid,
                  'away':a.get('abbrev',a.get('placeName',{}).get('default','—')),
                  'home':h.get('abbrev',h.get('placeName',{}).get('default','—')),
                  'awayScore':a.get('score','—'),
                  'homeScore':h.get('score','—'),
                  'status':status,
                  'date':g.get('startTimeUTC',''),
                  'period':g.get('periodDescriptor',{}).get('periodType',''),
                  'clock':g.get('clock',{}).get('timeRemaining','') if isinstance(g.get('clock'),dict) else '',
                  'nhlUrl':f'https://www.nhl.com/gamecenter/{gid}' if gid else ''
              }

              events=[]
              for key in ('scoring','goals'):
                  val=gs.get(key)
                  if isinstance(val,list):
                      for e in val[:30]:
                          if isinstance(e,dict):
                              events.append({
                                  'time':e.get('timeInPeriod',e.get('time','')),
                                  'text':e.get('description',e.get('goalDescription',e.get('typeDescKey',''))),
                                  'period':e.get('periodDescriptor',{}).get('number','') if isinstance(e.get('periodDescriptor'),dict) else ''
                              })
                      break
              if events:
                  item['events']=events

              games.append(item)

          standings=[]
          for x in st.get('standings',[]):
              standings.append({
                  'team':x.get('teamAbbrev',{}).get('default','—'),
                  'pts':x.get('points','—'),
                  'wins':x.get('wins','—'),
                  'losses':x.get('losses','—'),
                  'diff':x.get('goalDifferential','—')
              })

          # ---------- ESPN NEWS ----------
          news=[]

          def parse_news(payload):
              out=[]
              if not isinstance(payload,dict):
                  return out

              articles=payload.get('headlines',[])
              if not isinstance(articles,list) or not articles:
                  articles=payload.get('articles',[])

              for a in articles[:12]:
                  if not isinstance(a,dict):
                      continue
                  links=a.get('links',{}) if isinstance(a.get('links'),dict) else {}
                  web=links.get('web',{}) if isinstance(links.get('web'),dict) else {}

                  title=a.get('headline',a.get('title',''))
                  if not title:
                      continue

                  out.append({
                      'title':title,
                      'ruTitle':title,
                      'description':a.get('description',a.get('summary','')),
                      'url':web.get('href',a.get('link','')),
                      'published':str(a.get('published',a.get('lastModified','')))[:16].replace('T',' ')
                  })
              return out

          # Primary: ESPN real-time Now API.
          try:
              en=get_json(
                  'https://now.core.api.espn.com/v1/sports/news'
                  '?sport=hockey&leagues=nhl&limit=12'
              )
              news=parse_news(en)
          except Exception:
              pass

          # Fallback: ESPN site API.
          if not news:
              try:
                  en=get_json(
                      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/news?limit=12'
                  )
                  news=parse_news(en)
              except Exception:
                  pass

          # ---------- SIMPLE TRANSLATION ----------
          # No API key required. If the public endpoint is unavailable, the English
          # title remains available and the site still works.
          def translate_title(text):
              if not text:
                  return text
              try:
                  q=urllib.parse.quote(text)
                  url=f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q={q}'
                  req=urllib.request.Request(
                      url,
                      headers={'User-Agent':'Mozilla/5.0 (NHL-Russia/10.0)'}
                  )
                  with urllib.request.urlopen(req,timeout=15) as r:
                      raw=json.load(r)
                  parts=[]
                  if isinstance(raw,list) and raw and isinstance(raw[0],list):
                      for p in raw[0]:
                          if isinstance(p,list) and p and p[0]:
                              parts.append(p[0])
                  result=''.join(parts).strip()
                  return result or text
              except Exception:
                  return text

          for a in news:
              original=a.get('title','')
              a['ruTitle']=translate_title(original)

          # ---------- ESPN GAMECAST LINKS ----------
          try:
              es=get_json(
                  f'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates={today.replace("-","")}'
              )
              bypair={}
              for ev in es.get('events',[]):
                  comp=(ev.get('competitions') or [{}])[0]
                  teams=comp.get('competitors',[])
                  names=[t.get('team',{}).get('abbreviation') for t in teams]
                  if len(names)==2:
                      links=ev.get('links') or []
                      href=links[0].get('href','') if links and isinstance(links[0],dict) else ''
                      bypair[f'{names[0]}-{names[1]}']=href

              for x in games:
                  u=bypair.get(f"{x['away']}-{x['home']}")
                  if u:
                      x['espnUrl']=u
          except Exception:
              pass

          data={
              'updated':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'games':games,
              'standings':standings,
              'news':news
          }

          with open('data.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          PY

      - name: Commit data safely
        run: |
          set -e
          git config user.name github-actions
          git config user.email github-actions@github.com

          # Save the freshly generated data before synchronizing with main.
          cp data.json /tmp/nhl-data.json

          # GitHub Pages or another workflow can add a commit while this job runs.
          # Reset to the newest main, then put our freshly generated data back.
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nhl-data.json data.json

          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update NHL and translated ESPN news"

          # Small retry loop for a simultaneous scheduled run.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi
            echo "Push was rejected; synchronizing and retrying..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nhl-data.json data.json
            git add data.json
            git commit -m "Update NHL and translated ESPN news" || true
          done

          echo "Could not push after 3 attempts."
          exit 1

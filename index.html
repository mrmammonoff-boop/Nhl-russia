<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НХЛ Россия</title><style>:root{--bg:#071321;--p:#0d1d30;--l:#23405c;--t:#f5f8ff;--m:#9aafc4;--b:#2f8cff;--g:#35df86}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b2745,#071321 330px,#050d17);color:var(--t);font-family:Arial,system-ui,sans-serif}header{padding:18px 14px 12px;background:linear-gradient(135deg,#0b2442,#104d80);border-bottom:1px solid #2a5275;position:sticky;top:0;z-index:10}.top{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:11px}.logo{font-size:34px}.title{font-size:28px;font-weight:900}.sub{font-size:13px;color:#bfd0e2}nav{display:flex;gap:7px;margin-top:15px;overflow-x:auto}nav button{border:0;border-radius:12px;padding:11px 14px;background:#0a2946;color:#dce8f5;font-weight:800;white-space:nowrap}nav button.active{background:var(--b);color:#fff}.wrap{max-width:1100px;margin:auto;padding:15px 12px 40px}.status,.card,.game,.hero{background:var(--p);border:1px solid var(--l);border-radius:18px}.status{padding:13px 15px;display:flex;justify-content:space-between;margin-bottom:14px}.dot{display:inline-block;width:10px;height:10px;background:var(--g);border-radius:50%;margin-right:7px}.updated{font-size:11px;color:var(--m);text-align:right}.hero{padding:19px;margin-bottom:15px;background:linear-gradient(135deg,#102e4d,#0b1a2b)}.eyebrow{font-size:11px;color:#72b5ff;font-weight:900;letter-spacing:1px}.hero h2{font-size:25px;margin:5px 0 7px}.hero p{margin:0;color:#afc1d4;line-height:1.4}.head{display:flex;justify-content:space-between;margin:17px 2px 9px}.head h2{margin:0;font-size:21px}.count{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game{padding:14px;cursor:pointer}.game-top{display:flex;justify-content:space-between;margin-bottom:12px}.state{font-size:11px;font-weight:900;color:var(--m)}.live{color:var(--g)}.date{font-size:11px;color:var(--m)}.teams{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center}.team{text-align:center;font-weight:900;font-size:16px}.team small{display:block;font-size:10px;color:#8198ae;margin-top:4px}.score{text-align:center;font-size:22px;font-weight:900;line-height:1.25}.meta{border-top:1px solid var(--l);margin-top:12px;padding-top:9px;text-align:center;color:#7890a7;font-size:10px}.click{color:#6eb1f5;margin-top:4px}.tablewrap{overflow:auto}.table{width:100%;min-width:520px;border-collapse:collapse}.table th{font-size:10px;color:#7890a7;text-align:left;padding:9px;border-bottom:1px solid var(--l)}.table td{padding:11px 9px;border-bottom:1px solid #183149;font-size:13px}.club,.pts{font-weight:800}.news{display:grid;gap:10px}.article{display:block;text-decoration:none;color:inherit;padding:14px;background:var(--p);border:1px solid var(--l);border-radius:16px}.article b{font-size:15px;line-height:1.3}.article p{font-size:11px;color:var(--m)}.article span{font-size:10px;color:#6eb1f5;font-weight:800}.detail{display:none}.back,.link{border:0;border-radius:11px;background:#173754;color:#fff;padding:10px 13px;font-weight:800}.back{margin-bottom:12px}.match{padding:20px;text-align:center;background:linear-gradient(135deg,#102e4d,#0b1a2b);border:1px solid var(--l);border-radius:20px}.matchstate{font-size:12px;color:var(--g);font-weight:900}.matchteams{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;margin-top:13px}.mteam{font-size:20px;font-weight:900}.bigscore{font-size:31px;font-weight:900;line-height:1.2}.links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.link{display:inline-block;text-decoration:none;font-size:12px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}.detailbox{padding:15px}.event{padding:8px 0;border-bottom:1px solid #19344c;font-size:12px}.empty{text-align:center;color:var(--m);padding:28px}@media(max-width:700px){.grid{grid-template-columns:1fr}.title{font-size:26px}.detailgrid{grid-template-columns:1fr}.matchteams{grid-template-columns:1fr 72px 1fr}.mteam{font-size:18px}}@media(max-width:390px){.status{display:block}.updated{text-align:left;margin-top:5px}}</style></head><body><header><div class="top"><div class="brand"><div class="logo">🏒</div><div><div class="title">НХЛ Россия</div><div class="sub">Матчи · таблица · россияне · новости</div></div></div><nav id="nav"><button class="active" data-tab="home">🏒 Матчи</button><button data-tab="table">📊 Таблица</button><button data-tab="russians">🇷🇺 Россияне</button><button data-tab="news">📰 Новости</button></nav></div></header><main class="wrap"><div id="main"><div class="status"><div><span class="dot"></span><b>NHL Game Center</b></div><div id="updated" class="updated">загрузка…</div></div><section id="home"></section><section id="table" style="display:none"></section><section id="russians" style="display:none"></section><section id="news" style="display:none"></section></div><div id="detail" class="detail"></div></main><script>
(function(){var D={games:[],standings:[],news:[],updated:null},$=function(x){return document.getElementById(x)},esc=function(v){return String(v==null?'—':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})},state=function(s){return s==='LIVE'?'LIVE':s==='FINAL'?'ЗАВЕРШЁН':s==='FUT'?'СКОРО':s||'МАТЧ'};
function tab(n,b){['home','table','russians','news'].forEach(function(x){$(x).style.display=x===n?'block':'none'});document.querySelectorAll('#nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');$('detail').style.display='none';$('main').style.display='block';window.scrollTo(0,0)}document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){tab(b.getAttribute('data-tab'),b)}});
function card(x,i){return '<article class="game" data-i="'+i+'"><div class="game-top"><span class="state '+(x.status==='LIVE'?'live':'')+'">'+esc(state(x.status))+'</span><span class="date">'+esc(x.date||'')+'</span></div><div class="teams"><div class="team">'+esc(x.away)+'<small>ГОСТИ</small></div><div class="score">'+esc(x.awayScore)+'<br>:<br>'+esc(x.homeScore)+'</div><div class="team">'+esc(x.home)+'<small>ХОЗЯЕВА</small></div></div><div class="meta">НХЛ · игровой день<div class="click">Нажмите для подробностей →</div></div></article>'}
function home(){var live=D.games.filter(function(x){return x.status==='LIVE'}),other=D.games.filter(function(x){return x.status!=='LIVE'});$('home').innerHTML='<div class="hero"><div class="eyebrow">GAME CENTER</div><h2>Матчи NHL</h2><p>Результаты и ближайшие игры. Нажмите на матч для подробностей.</p></div><div class="head"><h2>🔥 LIVE</h2><span class="count">'+live.length+' матчей</span></div><div class="grid">'+(live.length?live.map(function(x){return card(x,D.games.indexOf(x))}).join(''):'<div class="card empty">Сейчас нет матчей LIVE.</div>')+'</div><div class="head"><h2>🏒 Остальные матчи</h2><span class="count">'+other.length+'</span></div><div class="grid">'+(other.length?other.map(function(x){return card(x,D.games.indexOf(x))}).join(''):'<div class="card empty">Нет матчей.</div>')+'</div>';document.querySelectorAll('.game').forEach(function(g){g.onclick=function(){openGame(Number(g.getAttribute('data-i')))}})}
function table(){var rows=D.standings.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td class="club">'+esc(x.team)+'</td><td class="pts">'+esc(x.pts)+'</td><td>'+esc(x.wins)+'</td><td>'+esc(x.losses)+'</td><td>'+esc(x.diff)+'</td></tr>'}).join('');$('table').innerHTML='<div class="hero"><div class="eyebrow">STANDINGS</div><h2>Турнирная таблица</h2><p>Актуальные данные NHL.</p></div><div class="card tablewrap"><table class="table"><thead><tr><th>#</th><th>Команда</th><th>О</th><th>В</th><th>П</th><th>РШ</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
function russians(){$('russians').innerHTML='<div class="hero"><div class="eyebrow">RUSSIANS IN NHL</div><h2>🇷🇺 Россияне в NHL</h2><p>Игроки, очки, голы, передачи и последние матчи.</p></div><div class="card empty">Статистика россиян будет подключена следующим обновлением данных.</div>'}
function news() {var n=D.news||[],s='<div class="hero"><div class="eyebrow">ESPN NHL</div><h2>📰 Новости NHL</h2><p>Заголовки и ссылки на оригинальные материалы ESPN.</p></div><div class="news">';if(!n.length)s+='<div class="card empty">Новости ESPN пока не загружены.</div>';n.forEach(function(a){if(a.url)s+='<a class="article" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.title)+'</b><p>'+esc(a.description||'')+'</p><span>ESPN → открыть оригинал</span></a>'});$('news').innerHTML=s+'</div>'}
function openGame(i){var x=D.games[i];if(!x)return;$('main').style.display='none';$('detail').style.display='block';var ev='';(x.events||[]).forEach(function(e){ev+='<div class="event"><b>'+esc(e.time||'')+'</b> · '+esc(e.text||'')+'</div>'});if(!ev)ev='<div class="empty">Подробные события пока не переданы источником данных.</div>';var links='';if(x.espnUrl)links+='<a class="link" href="'+esc(x.espnUrl)+'" target="_blank" rel="noopener">ESPN Gamecast →</a>';if(x.nhlUrl)links+='<a class="link" href="'+esc(x.nhlUrl)+'" target="_blank" rel="noopener">NHL Gamecenter →</a>';$('detail').innerHTML='<button class="back" id="back">← Все матчи</button><div class="match"><div class="matchstate">'+esc(state(x.status))+'</div><div class="matchteams"><div class="mteam">'+esc(x.away)+'</div><div class="bigscore">'+esc(x.awayScore)+'<br>:<br>'+esc(x.homeScore)+'</div><div class="mteam">'+esc(x.home)+'</div></div><div class="links">'+links+'</div></div><div class="detailgrid"><div class="card detailbox"><h3>⚡ События</h3>'+ev+'</div><div class="card detailbox"><h3>📊 Матч</h3><div class="event">Статус: '+esc(state(x.status))+'</div><div class="event">ID: '+esc(x.id||'—')+'</div></div></div>';$('back').onclick=function(){$('detail').style.display='none';$('main').style.display='block'}}
function render(){$('updated').textContent=D.updated?'Обновлено '+new Date(D.updated).toLocaleString('ru-RU'):'Ожидает обновления';home();table();russians();news()}fetch('data.json?'+Date.now()).then(function(r){return r.json()}).then(function(x){D=x||D;render()}).catch(function(){render()})})();</script></body></html>

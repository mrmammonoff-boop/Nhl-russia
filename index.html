<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>НХЛ Россия</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}
header{background:linear-gradient(135deg,#0b1f3a,#123b68);padding:22px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:30px}header p{margin:6px 0 0;opacity:.75}
nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button{border:0;border-radius:10px;padding:10px 13px;background:#173354;color:#fff;font-weight:700}
button.active{background:#2d8cff}.wrap{max-width:1100px;margin:auto;padding:14px}
.card{background:#0e1c2d;border:1px solid #203650;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.muted{opacity:.65}.live{color:#4ade80;font-weight:800}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #203650;text-align:left}th{opacity:.65}
.score{font-size:22px;font-weight:800}
@media(max-width:600px){h1{font-size:25px}.wrap{padding:10px}.card{padding:13px}}
</style></head>
<body><header><h1>🏒 НХЛ Россия</h1><p>Матчи · таблица · статистика · россияне</p><nav>
<button class="active" onclick="show('games',this)">Матчи</button><button onclick="show('table',this)">Таблица</button><button onclick="show('about',this)">О сайте</button>
</nav></header><main class="wrap"><div id="status" class="card">⏳ Загружаю актуальные данные…</div><section id="games"></section><section id="table" style="display:none"></section><section id="about" style="display:none" class="card"><h2>НХЛ Россия 7.0</h2><p>Данные обновляются автоматически через GitHub Actions. Сайт открывается обычной ссылкой на GitHub Pages.</p></section></main>
<script>
let D={games:[],standings:[],updated:null};
function show(id,b){for(const x of ['games','table','about'])document.getElementById(x).style.display=x===id?'block':'none';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function render(){
const g=document.getElementById('games');
g.innerHTML='<h2>🏒 Матчи</h2>'+(!D.games.length?'<div class="card"><p class="muted">Данные появятся после первого обновления.</p></div>':D.games.map(x=>'<div class="card"><div class="muted">'+(x.status||'')+'</div><div class="grid"><div><b>'+x.away+'</b><div class="score">'+x.awayScore+'</div></div><div><b>'+x.home+'</b><div class="score">'+x.homeScore+'</div></div></div></div>').join(''));
document.getElementById('table').innerHTML='<div class="card"><h2>📊 Таблица</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Команда</th><th>О</th><th>В</th><th>П</th><th>РШ</th></tr></thead><tbody>'+D.standings.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.team+'</td><td>'+x.pts+'</td><td>'+x.wins+'</td><td>'+x.losses+'</td><td>'+x.diff+'</td></tr>').join('')+'</tbody></table></div></div>';
document.getElementById('status').innerHTML='🟢 Последнее обновление: '+(D.updated?new Date(D.updated).toLocaleString('ru-RU'):'ожидается');
}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;render()}).catch(render);
</script></body></html>

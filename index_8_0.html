<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НХЛ Россия</title><style>
:root{--bg:#06101d;--p:#0d1b2c;--l:#1d3854;--t:#f4f8ff;--m:#91a5bc;--b:#2f8cff;--g:#35df86;--r:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123762,#081525 42%,#050d18);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#0b223e,#0d3962);padding:18px 14px 13px;position:sticky;top:0;z-index:10;border-bottom:1px solid #24496b}.top{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:34px}.title{font-size:28px;font-weight:900}.sub{color:#b9cbe0;font-size:13px}nav{display:flex;gap:8px;overflow:auto;margin-top:15px}nav button{border:0;border-radius:13px;padding:11px 16px;background:#07182b99;color:#dbe8f7;font-weight:800;white-space:nowrap}nav button.active{background:var(--b);color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px 12px 35px}.status{display:flex;justify-content:space-between;gap:10px;background:#0d1b2cf2;border:1px solid var(--l);border-radius:18px;padding:14px 15px;margin-bottom:16px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 12px #35df86;vertical-align:middle;margin-right:7px}.updated{color:var(--m);font-size:12px;text-align:right}.hero{background:linear-gradient(135deg,#102b49,#0b1b2e);border:1px solid #244663;border-radius:21px;padding:19px;margin-bottom:16px}.ey{color:#72b4ff;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px}.hero h2{margin:5px 0 7px;font-size:26px}.hero p{margin:0;color:#a9bdd2;line-height:1.45}.head{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 9px}.head h2{margin:0;font-size:21px}.muted{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game,.card{background:#0d1b2cf2;border:1px solid var(--l);border-radius:18px;padding:15px;box-shadow:0 10px 25px #0003}.game-top{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:14px}.teams{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:7px}.team{text-align:center;font-weight:900}.team small{display:block;color:var(--m);font-size:10px;margin-top:4px}.score{text-align:center;font-size:21px;font-weight:900;line-height:1.25}.bottom{border-top:1px solid var(--l);margin-top:13px;padding-top:9px;color:#647d97;text-align:center;font-size:10px}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #173049}th{color:#7890aa;font-size:10px;text-transform:uppercase}.club{font-weight:800}.pts{font-weight:900}.plus{color:var(--g)}.minus{color:var(--r)}.empty{text-align:center;color:var(--m);padding:28px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.feature{background:#0b1929;border:1px solid var(--l);border-radius:15px;padding:14px}.feature b{display:block;margin-bottom:4px}.feature span{font-size:12px;color:var(--m)}footer{text-align:center;color:#50667d;font-size:10px;padding-top:20px}@media(max-width:700px){.title{font-size:25px}.grid{grid-template-columns:1fr}.hero h2{font-size:23px}.status{align-items:flex-start}.features{grid-template-columns:1fr 1fr}}@media(max-width:390px){.features{grid-template-columns:1fr}.status{display:block}.updated{text-align:left;margin-top:5px}}
</style></head><body><header><div class="top"><div class="brand"><div class="logo">🏒</div><div><div class="title">НХЛ Россия</div><div class="sub">Матчи · таблица · россияне · статистика</div></div></div><nav><button class="active" onclick="show('games',this)">🏒 Матчи</button><button onclick="show('table',this)">📊 Таблица</button><button onclick="show('rus',this)">🇷🇺 Россияне</button><button onclick="show('about',this)">ℹ️ О сайте</button></nav></div></header><main class="wrap"><div class="status"><div><span class="dot"></span><b>Данные NHL обновляются автоматически</b></div><div id="updated" class="updated">загрузка…</div></div><section id="games"></section><section id="table" style="display:none"></section><section id="rus" style="display:none"></section><section id="about" style="display:none"></section><footer>НХЛ Россия · GitHub Actions · актуальные данные NHL</footer></main><script>
let D={games:[],standings:[],updated:null};const e=s=>String(s??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));function show(id,b){['games','table','rus','about'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');scrollTo({top:0,behavior:'smooth'})}
function games(){let x=document.getElementById('games');if(!D.games.length){x.innerHTML='<div class="hero"><div class="ey">Game Center</div><h2>Матчи NHL</h2><p>Сейчас игр нет. Новые результаты появятся автоматически после обновления NHL.</p></div>';return}x.innerHTML='<div class="hero"><div class="ey">Game Center</div><h2>Матчи NHL</h2><p>Актуальные результаты игрового дня.</p></div><div class="head"><h2>🏒 Игры</h2><span class="muted">'+D.games.length+' матчей</span></div><div class="grid">'+D.games.map(g=>'<article class="game"><div class="game-top"><span>'+e(g.status||'Матч')+'</span><span>'+(g.date?new Date(g.date).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</span></div><div class="teams"><div class="team">'+e(g.away)+'<small>ГОСТИ</small></div><div class="score">'+e(g.awayScore)+'<br><span>:</span><br>'+e(g.homeScore)+'</div><div class="team">'+e(g.home)+'<small>ХОЗЯЕВА</small></div></div><div class="bottom">НХЛ · официальный игровой день</div></article>').join('')+'</div>'}
function table(){let x=document.getElementById('table');if(!D.standings.length){x.innerHTML='<div class="card empty">📊<br>Таблица пока не загружена.</div>';return}x.innerHTML='<div class="hero"><div class="ey">Standings</div><h2>Турнирная таблица</h2><p>Показатели получены из NHL.</p></div><div class="card" style="overflow:auto"><table><thead><tr><th>#</th><th>Команда</th><th>О</th><th>В</th><th>П</th><th>РШ</th></tr></thead><tbody>'+D.standings.map((r,i)=>'<tr><td>'+(i+1)+'</td><td class="club">'+e(r.team)+'</td><td class="pts">'+e(r.pts)+'</td><td>'+e(r.wins)+'</td><td>'+e(r.losses)+'</td><td class="'+(Number(r.diff)>0?'plus':Number(r.diff)<0?'minus':'')+'">'+e(r.diff)+'</td></tr>').join('')+'</tbody></table></div>'}
function rus(){document.getElementById('rus').innerHTML='<div class="hero"><div class="ey">Russian players</div><h2>🇷🇺 Россияне в NHL</h2><p>Здесь будет статистика российских хоккеистов: голы, передачи, очки и последние матчи.</p></div><div class="card empty">🇷🇺<br><br><b>Раздел россиян — следующий этап.</b><div class="muted" style="margin-top:8px">Реальные матчи и таблица уже подключены. Теперь добавим игроков и их статистику.</div></div>'}
function about(){document.getElementById('about').innerHTML='<div class="hero"><div class="ey">НХЛ Россия 8.0</div><h2>Хоккейный центр в одном месте</h2><p>Русскоязычный сайт NHL, сделанный прежде всего для телефона.</p></div><div class="features"><div class="feature"><b>🏒 Матчи</b><span>Результаты игрового дня.</span></div><div class="feature"><b>📊 Таблица</b><span>Команды и основные показатели.</span></div><div class="feature"><b>🔄 Автообновление</b><span>Данные обновляются через GitHub Actions.</span></div></div>'}
function render(){document.getElementById('updated').textContent=D.updated?'Обновлено '+new Date(D.updated).toLocaleString('ru-RU'):'Ожидает обновления';games();table();rus();about()}fetch('data.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;render()}).catch(render);
</script></body></html>
